name: FXAlways
options:
  bundleIdPrefix: com.fxalways
  deploymentTarget:
    iOS: "16.0"
packages:
  purchases-hybrid-common:
    url: https://github.com/RevenueCat/purchases-hybrid-common.git
    exactVersion: 17.55.1
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp/iosApp
    dependencies:
      - framework: composeApp/build/xcode-frameworks/$(CONFIGURATION)/ComposeApp.framework
      - package: purchases-hybrid-common
        product: PurchasesHybridCommon
    preBuildScripts:
      - name: Build Compose framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          CONFIG_DIR="$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          case "$SDK_NAME" in
            iphoneos*)
              KOTLIN_TARGET="iosArm64"
              GRADLE_TARGET="IosArm64"
              ;;
            iphonesimulator*)
              KOTLIN_TARGET="iosSimulatorArm64"
              GRADLE_TARGET="IosSimulatorArm64"
              ;;
            *)
              echo "Unsupported SDK_NAME: $SDK_NAME"
              exit 1
              ;;
          esac

          DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}" \
            ./gradlew --no-daemon ":composeApp:link${CONFIGURATION}Framework${GRADLE_TARGET}" -Pkotlin.native.cacheKind=none

          SRC="$PROJECT_DIR/composeApp/build/bin/$KOTLIN_TARGET/${CONFIG_DIR}Framework/ComposeApp.framework"
          DST="$PROJECT_DIR/composeApp/build/xcode-frameworks/$CONFIGURATION/ComposeApp.framework"
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          rsync -a "$SRC/" "$DST/"
    postBuildScripts:
      - name: Copy Compose resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          RESOURCES_SRC="$PROJECT_DIR/composeApp/build/intermediates/assets/debug/mergeDebugAssets/composeResources"
          RESOURCES_DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources/composeResources"
          if [ -d "$RESOURCES_SRC" ]; then
            rm -rf "$RESOURCES_DST"
            mkdir -p "$(dirname "$RESOURCES_DST")"
            rsync -a "$RESOURCES_SRC/" "$RESOURCES_DST/"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fxalways.app.ios
        PRODUCT_NAME: FX Always
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WG3H7G372D
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/composeApp/build/xcode-frameworks/$(CONFIGURATION)
    info:
      path: iosApp/iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDisplayName: FX Always
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
