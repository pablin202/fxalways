name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_TEST_LAB_PROJECT: ${{ vars.FIREBASE_TEST_LAB_PROJECT || 'fx-always' }}
  FIREBASE_TEST_LAB_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_LAB_RESULTS_BUCKET || 'fx-always-test-lab-results' }}

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile Android and Test Lab artifacts
        run: >
          ./gradlew
          :composeApp:compileDebugKotlinAndroid
          :composeApp:compileDebugAndroidTestKotlinAndroid
          :composeApp:assembleDebug
          :composeApp:packageDebugAndroidTest

      - name: Upload Firebase Test Lab artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-firebase-test-lab-artifacts
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  firebase-test-lab:
    name: Firebase Test Lab UI tests
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Test Lab artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-firebase-test-lab-artifacts
          path: test-lab-artifacts

      - name: Validate Firebase Test Lab auth config
        run: |
          test -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || (echo "Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || (echo "Missing secret GCP_SERVICE_ACCOUNT" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Select Test Lab devices
        run: |
          set -euo pipefail
          gcloud config set project "$FIREBASE_TEST_LAB_PROJECT"
          gcloud firebase test android models list --format=json > test-lab-models.json
          python3 .github/scripts/select_test_lab_devices.py test-lab-models.json > test-lab-devices.args
          echo "Selected Firebase Test Lab devices:"
          cat test-lab-devices.args

      - name: Run instrumentation tests in Firebase Test Lab
        run: |
          set -euo pipefail
          APP_APK="$(find test-lab-artifacts -path '*/debug/*.apk' ! -name '*androidTest*' | head -n 1)"
          TEST_APK="$(find test-lab-artifacts -path '*/androidTest/debug/*.apk' | head -n 1)"
          test -f "$APP_APK" || (echo "Missing app debug APK" && exit 1)
          test -f "$TEST_APK" || (echo "Missing androidTest APK" && exit 1)
          mapfile -t DEVICE_ARGS < test-lab-devices.args
          gcloud firebase test android run \
            --project "$FIREBASE_TEST_LAB_PROJECT" \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --use-orchestrator \
            --num-flaky-test-attempts 1 \
            --timeout 30m \
            --client-details matrixLabel="main-${{ github.run_number }}-${{ github.sha }}" \
            --results-bucket "$FIREBASE_TEST_LAB_RESULTS_BUCKET" \
            --results-dir "github/${{ github.run_id }}-${{ github.run_attempt }}" \
            "${DEVICE_ARGS[@]}"

  android-play-release:
    name: Android Play release
    runs-on: ubuntu-latest
    needs: firebase-test-lab
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      RELEASE_VERSION_CODE: ${{ github.run_number }}
      RELEASE_VERSION_NAME: 1.0.${{ github.run_number }}
      RELEASE_TAG: android-v1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate release signing config
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Missing secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "Missing secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "Missing secret ANDROID_KEY_PASSWORD" && exit 1)
          test -n "${{ secrets.REVENUECAT_API_KEY }}" || (echo "Missing secret REVENUECAT_API_KEY" && exit 1)

      - name: Build signed Play AAB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/android-signing/upload.jks"
          ./gradlew :composeApp:bundleRelease \
            -PANDROID_VERSION_CODE="$RELEASE_VERSION_CODE" \
            -PANDROID_VERSION_NAME="$RELEASE_VERSION_NAME" \
            -PANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-signing/upload.jks" \
            -PANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -PREVENUECAT_API_KEY="${{ secrets.REVENUECAT_API_KEY }}"

      - name: Upload R8 mapping (deobfuscation file)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-mapping-${{ env.RELEASE_VERSION_CODE }}
          path: composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          AAB="composeApp/build/outputs/bundle/release/composeApp-release.aab"
          RELEASE_AAB="release-assets/FxAlways-${RELEASE_VERSION_NAME}-${RELEASE_VERSION_CODE}.aab"
          test -f "$AAB" || (echo "Missing release AAB" && exit 1)
          cp "$AAB" "$RELEASE_AAB"
          sha256sum "$RELEASE_AAB" > "${RELEASE_AAB}.sha256"
          {
            echo "Closed-test polish release"
            echo
            echo "- Traveler is simpler first: price check, conversion, tipping/local rules and trip budget are easier to reach before dense market data."
            echo "- Free users can choose their own destination instead of being locked to a fixed country list."
            echo "- Pro is easier to find with one global entry point, fewer repeated upsells and clearer locked-feature sources."
            echo "- News, conversion and local travel guidance have clearer empty states, metadata and first-screen recommendations."
            echo
            echo "AAB: $(basename "$RELEASE_AAB")"
            echo "versionName: $RELEASE_VERSION_NAME"
            echo "versionCode: $RELEASE_VERSION_CODE"
            echo "commit: $GITHUB_SHA"
          } > release-assets/release-notes.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Android ${RELEASE_VERSION_NAME} (${RELEASE_VERSION_CODE})"
          NOTES="$(cat release-assets/release-notes.txt)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.aab release-assets/*.sha256 --clobber

  functions:
    name: Firebase Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: npm run build

  ios-kmp:
    name: iOS KMP compile
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile iOS shared framework
        run: ./gradlew :composeApp:compileKotlinIosArm64
